<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OpenAI TTS リアルタイム再生</title>
  <!-- Tailwind CSS をCDNから読み込む -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-start { background-color: #dbeafe; color: #1e40af; }
    .status-pushed { background-color: #fef3c7; color: #92400e; }
    .status-end { background-color: #dcfce7; color: #166534; }
    
    .waveform-container {
      position: relative;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      overflow: hidden;
    }
    
    .warning-badge {
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .concurrent-item {
      background-color: #fee2e2;
      border-left: 4px solid #dc2626;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800">
  <div class="max-w-4xl mx-auto p-6">
    <!-- ヘッダー -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">🎙️ OpenAI TTS リアルタイム再生デモ</h1>
      <p class="text-gray-600">テキストをリアルタイムで音声に変換して自動再生します</p>
    </div>

    <!-- メインコンテンツ -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 左側：入力エリア -->
      <div class="lg:col-span-2">
        <!-- API Key 入力欄 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <label class="block mb-2 font-semibold text-gray-700">🔑 OpenAI API Key:</label>
          <input
            type="password"
            id="apiKeyInput"
            class="block w-full p-3 border border-gray-300 rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="sk-xxxx..."
          />
          <p class="text-sm text-gray-500">APIキーはブラウザに保存されません</p>
        </div>

        <!-- テキスト入力欄 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <label class="block mb-2 font-semibold text-gray-700">📝 再生したいテキスト:</label>
          <p class="text-sm text-gray-500 mb-3">「。」で区切られた文ごとに順番に再生されます</p>
          <textarea
            id="textInput"
            class="block w-full p-3 border border-gray-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"
            rows="8"
            placeholder="こんにちは。これはリアルタイムの音声合成デモです。複数の文を入力してください。"
          >[message]</textarea>
          
          <!-- コントロールボタン -->
          <div class="flex gap-3 flex-wrap">
            <button
              id="startButton"
              class="bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-all shadow-md hover:shadow-lg"
            >
              ▶️ 再生開始
            </button>
            <button
              id="pause"
              class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-white font-bold py-3 px-6 rounded-lg transition-all shadow-md hover:shadow-lg"
            >
              ⏸️ 一時停止
            </button>
            <button
              id="stop"
              class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-bold py-3 px-6 rounded-lg transition-all shadow-md hover:shadow-lg"
            >
              ⏹️ 再生停止
            </button>
          </div>
        </div>
      </div>

      <!-- 右側：ステータスパネル -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-lg shadow-lg p-6 sticky top-6">
          <h2 class="text-lg font-bold text-gray-800 mb-4">📊 再生状態</h2>
          
          <div class="mb-4">
            <p class="text-sm text-gray-600 mb-1">現在の行番号</p>
            <p class="text-3xl font-bold text-blue-600" id="curIdx">0</p>
          </div>

          <!-- 多重再生警告 -->
          <div id="concurrentWarning" class="hidden mb-4 p-3 bg-red-50 border-l-4 border-red-500 rounded">
            <div class="flex items-center">
              <span class="text-2xl mr-2">⚠️</span>
              <div>
                <p class="text-sm font-bold text-red-700">多重再生検知</p>
                <p class="text-xs text-red-600" id="concurrentCount">複数の音声が同時再生されています</p>
              </div>
            </div>
          </div>

          <!-- 待機中の表示 -->
          <div id="waitingNotice" class="hidden mb-4 p-3 bg-yellow-50 border-l-4 border-yellow-500 rounded">
            <div class="flex items-center">
              <span class="text-2xl mr-2">⏳</span>
              <div>
                <p class="text-sm font-bold text-yellow-700">待機中</p>
                <p class="text-xs text-yellow-600" id="waitingInfo">前の音声の終了を待っています</p>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <p class="text-sm text-gray-600 mb-2">前の文</p>
            <div class="bg-gray-50 p-3 rounded text-sm text-gray-700 min-h-12" id="prevText">-</div>
          </div>

          <div class="mb-4">
            <p class="text-sm text-gray-600 mb-2">現在の文</p>
            <div class="bg-blue-50 p-3 rounded text-sm text-gray-700 font-semibold min-h-12 border-l-4 border-blue-500" id="currentText">-</div>
          </div>

          <div class="mb-4">
            <p class="text-sm text-gray-600 mb-2">処理状況</p>
            <div id="statusContainer" class="space-y-2 max-h-40 overflow-y-auto"></div>
          </div>

          <!-- 現在再生中の行リスト -->
          <div class="mb-4">
            <p class="text-sm text-gray-600 mb-2">再生中の行</p>
            <div id="playingList" class="bg-gray-50 p-2 rounded text-xs space-y-1 max-h-32 overflow-y-auto">
              <p class="text-gray-500">なし</p>
            </div>
          </div>

          <div class="pt-4 border-t">
            <p class="text-sm text-gray-600 mb-2">再生時間情報</p>
            <div class="bg-gray-50 p-2 rounded text-xs text-gray-700 font-mono space-y-1">
              <div>経過: <span id="elapsedTime">0.0</span>秒</div>
              <div>残り: <span id="remainingTime">0.0</span>秒</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 波形表示 -->
    <div class="bg-white rounded-lg shadow-lg p-6 mt-6">
      <h2 class="text-lg font-bold text-gray-800 mb-4">🎵 波形表示</h2>
      <div class="waveform-container">
        <canvas
          id="waveCanvas"
          width="800"
          height="200"
          class="w-full"
        ></canvas>
      </div>
    </div>

    <!-- ログパネル -->
    <div class="bg-white rounded-lg shadow-lg p-6 mt-6">
      <h2 class="text-lg font-bold text-gray-800 mb-4">📋 デバッグログ</h2>
      <div id="logContainer" class="bg-gray-900 text-gray-100 p-4 rounded font-mono text-xs h-40 overflow-y-auto"></div>
      <button id="clearLog" class="mt-2 bg-gray-600 hover:bg-gray-700 text-white py-1 px-3 rounded text-sm">
        ログをクリア
      </button>
    </div>
  </div>

  <script>
    // ========== ロギング機能 ==========
    function addLog(message) {
      const logContainer = document.getElementById("logContainer");
      const timestamp = new Date().toLocaleTimeString('ja-JP');
      const logEntry = document.createElement("div");
      logEntry.textContent = `[${timestamp}] ${message}`;
      logContainer.appendChild(logEntry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // ========== AudioContext の初期化 ==========
    const audioContext = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 24000
    });

    // ========== 受信データ管理 ==========
    let pendingBytes = new Uint8Array(0);
    let pendingBytesQueue = new Array(0);
    let leftover = new Uint8Array(0);

    // ========== 再生制御フラグ ==========
    let isPlaying = false;
    let sourceNode = null;
    let idxForceStop = -1;

    // ========== 多重再生検知 ==========
    let activePlayingSources = new Map(); // { myCnt: { startTime, text, sourceNode } }
    let concurrentPlayDetected = false;
    let playbackQueue = []; // 再生待ちのキュー

    /**
     * 前の音声が完全に終了するまで待機する関数
     */
    async function waitForPreviousPlayback(myCnt) {
      const waitingNotice = document.getElementById("waitingNotice");
      const waitingInfo = document.getElementById("waitingInfo");
      
      // 自分より前の行が再生中の場合、終了まで待機
      while (activePlayingSources.size > 0) {
        // 自分自身以外が再生中かチェック
        const otherPlaying = Array.from(activePlayingSources.keys()).filter(idx => idx !== myCnt);
        if (otherPlaying.length === 0) break;
        
        // 待機中の表示を更新
        waitingNotice.classList.remove("hidden");
        waitingInfo.textContent = `行${myCnt}が待機中 (再生中: [${otherPlaying.join(', ')}])`;
        
        addLog(`行${myCnt}: 他の音声が再生中のため待機... (再生中: [${otherPlaying.join(', ')}])`);
        
        // 100ms 待機
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      
      // 待機終了
      waitingNotice.classList.add("hidden");
    }

    // ========== AnalyserNode（波形可視化用） ==========
    const analyserNode = audioContext.createAnalyser();
    analyserNode.fftSize = 1024;
    const dataArray = new Uint8Array(analyserNode.frequencyBinCount);

    // Canvas の描画コンテキスト
    const waveCanvas = document.getElementById("waveCanvas");
    const waveCtx = waveCanvas.getContext("2d");

    // ========== 時間管理 ==========
    const playTimeout = 15 * 1000; // 15秒
    const intervalPerLine = 0.5; // 行間の時間（秒）
    
    // 各アイテムの実際の再生時間を記録する辞書
    let actualDurations = {}; // { myCnt: duration } 

    /**
     * 波形を描画する関数
     */
    function drawWaveform() {
      requestAnimationFrame(drawWaveform);
      // 背景をクリア
      waveCtx.fillStyle = "#667eea";
      waveCtx.fillRect(0, 0, waveCanvas.width, waveCanvas.height);

      // time domain data を取得
      analyserNode.getByteTimeDomainData(dataArray);

      waveCtx.lineWidth = 2;
      waveCtx.strokeStyle = "#fff";
      waveCtx.beginPath();

      const sliceWidth = waveCanvas.width * 1.0 / dataArray.length;
      let x = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const v = dataArray[i] / 128.0;
        const y = (v * waveCanvas.height) / 2;
        if (i === 0) {
          waveCtx.moveTo(x, y);
        } else {
          waveCtx.lineTo(x, y);
        }
        x += sliceWidth;
      }

      waveCtx.lineTo(waveCanvas.width, waveCanvas.height / 2);
      waveCtx.stroke();
    }

    let playTexts = new Array(0);
    let playStart = performance.now();
    let status = new Array(0);
    let playStarts = new Array(0);

    const STATUS_START = 0;
    const STATUS_PUSHED = 1;
    const STATUS_END = 2;

    let curPlaying = 0;

    // ========== ステータス更新表示 ==========
    function updateStatusDisplay() {
      const container = document.getElementById("statusContainer");
      container.innerHTML = "";
      
      // 最新の5件までを表示
      const startIdx = Math.max(0, status.length - 5);
      for (let i = startIdx; i < status.length; i++) {
        const statusText = ["待機中", "準備中", "完了"][status[i]] || "不明";
        const statusClass = ["status-start", "status-pushed", "status-end"][status[i]] || "status-start";
        
        // 多重再生チェック：この行が現在再生中かつ他にも再生中の行がある場合
        const isConcurrent = activePlayingSources.has(i) && activePlayingSources.size > 1;
        const concurrentClass = isConcurrent ? "concurrent-item" : "";
        
        const div = document.createElement("div");
        div.className = `text-xs truncate ${concurrentClass}`;
        div.innerHTML = `<span class="status-badge ${statusClass}">${statusText}</span> 行${i}${isConcurrent ? ' ⚠️' : ''}`;
        container.appendChild(div);
      }
    }

    // ========== 多重再生検知と表示 ==========
    function updateConcurrentPlayingDisplay() {
      const playingList = document.getElementById("playingList");
      const warningDiv = document.getElementById("concurrentWarning");
      const countSpan = document.getElementById("concurrentCount");
      
      if (activePlayingSources.size === 0) {
        playingList.innerHTML = '<p class="text-gray-500">なし</p>';
        warningDiv.classList.add("hidden");
        concurrentPlayDetected = false;
      } else {
        playingList.innerHTML = "";
        const entries = Array.from(activePlayingSources.entries());
        
        entries.forEach(([idx, info]) => {
          const div = document.createElement("div");
          const elapsed = (performance.now() - info.startTime) / 1000;
          const isConcurrent = activePlayingSources.size > 1;
          
          div.className = `p-2 rounded ${isConcurrent ? 'bg-red-100 border border-red-300' : 'bg-blue-100'}`;
          div.innerHTML = `
            <div class="font-bold ${isConcurrent ? 'text-red-700' : 'text-blue-700'}">
              ${isConcurrent ? '⚠️ ' : '▶️ '}行${idx}
            </div>
            <div class="text-xs text-gray-600 truncate">${info.text.substring(0, 30)}...</div>
            <div class="text-xs text-gray-500">経過: ${elapsed.toFixed(1)}秒</div>
          `;
          playingList.appendChild(div);
        });
        
        // 多重再生警告
        if (activePlayingSources.size > 1) {
          warningDiv.classList.remove("hidden");
          countSpan.textContent = `${activePlayingSources.size}個の音声が同時再生中`;
          if (!concurrentPlayDetected) {
            concurrentPlayDetected = true;
            addLog(`⚠️ 多重再生検知: ${activePlayingSources.size}個の音声が同時再生されています`);
          }
        } else {
          warningDiv.classList.add("hidden");
          concurrentPlayDetected = false;
        }
      }
    }

    function updateTimerDisplay() {
      if (curPlaying < 0 || !playStarts[curPlaying]) {
        document.getElementById("elapsedTime").textContent = "0.0";
        document.getElementById("remainingTime").textContent = "0.0";
        return;
      }

      if (isPlaying && sourceNode && sourceNode.buffer) {
        const elapsed = audioContext.currentTime - playStarts[curPlaying];
        const remaining = sourceNode.buffer.duration - elapsed;
        document.getElementById("elapsedTime").textContent = elapsed.toFixed(1);
        document.getElementById("remainingTime").textContent = Math.max(0, remaining).toFixed(1);
      }
      
      // 多重再生表示も更新
      updateConcurrentPlayingDisplay();
    }

    // タイマーループ（100ms ごと）
    setInterval(updateTimerDisplay, 100);

    function EndStatuses(cur) {
      if (cur - 5 < 0) {
        return;
      }

      for (let i = Math.max(0, cur - 5); i <= cur; i++) {
        if (status[i] != STATUS_END) {
          status[i] = STATUS_END;
        }
      }
      updateStatusDisplay();
    }

    function getRemainingTime(myCnt) {
      // 実際に記録された再生時間を使う
      if (actualDurations[myCnt] !== undefined) {
        return actualDurations[myCnt] * 1000 + 500; // 余裕を持たせる
      }
      
      if (sourceNode == null) {
        return playTimeout;
      }

      const totalDuration = sourceNode.buffer.duration + intervalPerLine;
      return Math.max(playTimeout, totalDuration * 1000);
    }

    // 再生をスケジューリングする関数
    async function schedulePlayback(myCnt) {

      if (isPlaying && performance.now() - playStart > getRemainingTime(myCnt)) {
        isPlaying = false;
        EndStatuses(curPlaying);
        idxForceStop = curPlaying;
        addLog(`強制停止: ${curPlaying} (タイムアウト)`);
        console.log("force stop: ", curPlaying);
        const curElapsed = performance.now() - playStart;
        const dur = getRemainingTime(myCnt);
        console.log("elapsed=", curElapsed / 1000,
          "remaining=", dur / 1000,
          "total=", sourceNode.buffer.duration);
        return;
      }

      // 【多重再生防止】前の音声が完全に終了するまで待機
      if (activePlayingSources.size > 0) {
        const waitingFor = Array.from(activePlayingSources.keys());
        addLog(`行${myCnt}: 待機開始 (再生中: [${waitingFor.join(', ')}])`);
        await waitForPreviousPlayback(myCnt);
        addLog(`行${myCnt}: 待機終了、再生を開始します`);
      }

      // すでに再生中ならスキップ（念のため再チェック）
      if (isPlaying) {
        addLog(`行${myCnt}: 既に他の音声が再生中のためスキップ`);
        return;
      }

      if (pendingBytesQueue.length == 0) {
        addLog(`行${myCnt}: キューが空のため再生できません`);
        return;
      }

      if (playTexts.length == 0) {
        addLog(`行${myCnt}: テキストが空のため再生できません`);
        return;
      }

      curPlaying = myCnt;
      isPlaying = true;

      playStart = performance.now();
      const ctext = playTexts.shift();
      document.getElementById("prevText").innerText = document.getElementById("currentText").innerText;
      document.getElementById("currentText").innerText = ctext;
      document.getElementById("curIdx").innerText = curPlaying;

      addLog(`再生開始: 行${curPlaying} "${ctext.substring(0, 20)}..."`);
      console.log("pop text", ctext);
      console.log("pop qeueue len=", pendingBytesQueue.length);

      // 今回再生する分
      const dataToPlay = pendingBytesQueue.shift(); // キューから取り出す

      // PCM16 → Int16
      const int16Data = new Int16Array(dataToPlay.buffer);

      // Int16 → Float32
      const float32Data = new Float32Array(int16Data.length);
      for (let i = 0; i < int16Data.length; i++) {
        float32Data[i] = int16Data[i] / 32768.0;
      }

      // AudioBuffer 作成 (モノラル:1ch)
      const audioBuffer = audioContext.createBuffer(1, float32Data.length, audioContext.sampleRate);
      audioBuffer.copyToChannel(float32Data, 0);

      // 実際の再生時間を記録
      const actualDuration = audioBuffer.duration;
      actualDurations[myCnt] = actualDuration;
      addLog(`音声データ長: 行${myCnt} ${actualDuration.toFixed(2)}秒`);

      // AudioBufferSourceNode で再生
      sourceNode = audioContext.createBufferSource();
      sourceNode.buffer = audioBuffer;

      // 多重再生検知: 再生開始時に activePlayingSources に追加
      activePlayingSources.set(myCnt, {
        startTime: performance.now(),
        text: ctext,
        sourceNode: sourceNode
      });
      
      // 多重再生をチェック
      if (activePlayingSources.size > 1) {
        const activeIndices = Array.from(activePlayingSources.keys()).join(', ');
        addLog(`⚠️ 警告: 多重再生検知！ 再生中の行: [${activeIndices}]`);
      }
      
      updateConcurrentPlayingDisplay();

      // AnalyserNode→destination へ接続
      sourceNode.connect(analyserNode);
      analyserNode.connect(audioContext.destination);

      // 再生終了時のイベント
      sourceNode.onended = () => {
        isPlaying = false;

        // 多重再生検知: 再生終了時に activePlayingSources から削除
        activePlayingSources.delete(myCnt);
        updateConcurrentPlayingDisplay();

        if (idxForceStop > -1 && idxForceStop != curPlaying) {
          EndStatuses(curPlaying - 1);
          idxForceStop = -1;
          return;
        }
        EndStatuses(curPlaying);
        addLog(`再生完了: 行${curPlaying}`);
        idxForceStop = -1;
      };

      sourceNode.start();
      playStarts[curPlaying] = audioContext.currentTime;
    }

    // 波形描画開始
    drawWaveform();

    isPause = false;
    isStop = false;

    document.getElementById("pause").addEventListener("click", () => {
      if (isPause) {
        audioContext.resume().then(() => {
          isPause = false;
          document.getElementById("pause").innerText = "⏸️ 一時停止";
          addLog("再開しました");
        });
      } else {
        audioContext.suspend().then(() => {
          isPause = true;
          document.getElementById("pause").innerText = "▶️ 再開";
          addLog("一時停止しました");
        });
      }
    });

    // 再生停止ボタンのクリックイベント    
    document.getElementById("stop").addEventListener("click", () => {
      isStop = true;
      
      // すべての再生中の音声を停止
      activePlayingSources.forEach((info, idx) => {
        if (info.sourceNode) {
          try {
            info.sourceNode.stop();
            info.sourceNode.disconnect();
          } catch (e) {
            console.error(`行${idx}の停止エラー:`, e);
          }
        }
      });
      
      if (sourceNode) {
        sourceNode.stop(); // 再生を停止
        sourceNode.disconnect(); // ノードを切断
        isPlaying = false; // 再生中フラグをリセット
        pendingBytes = new Uint8Array(0); // キューをクリア
        leftover = new Uint8Array(0); // leftover をクリア
      }
      
      // 多重再生管理をクリア
      activePlayingSources.clear();
      updateConcurrentPlayingDisplay();
      
      addLog("再生を停止しました");
    });

    // ログクリアボタン
    document.getElementById("clearLog").addEventListener("click", () => {
      document.getElementById("logContainer").innerHTML = "";
    });

    // OpenAI TTS 設定（必要に応じて変更）
    const model = "voicevox-v1";
    const voice = "1";
    const responseFormat = "pcm";

    let cnt = 0;

    const f = (text) => {
      return new Promise((resolve) =>
        setTimeout(() => {
          playTexts.push(text);

          const myCnt = cnt++;

          status[myCnt] = STATUS_START;
          updateStatusDisplay();

          addLog(`APIリクエスト送信: 行${myCnt} "${text.substring(0, 30)}..."`);

          fetch("http://10.2.1.15:19999/run2", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: model,
              input: text,
              voice: voice,
              speed: 1,
              response_format: responseFormat
            })
          }).then((response) => {
            if (!response.ok) {
              throw new Error(`OpenAI API error: ${response.status}`);
            }
            addLog(`APIレスポンス受信: 行${myCnt}`);
            console.log("request text: ", text);
            return response.body.getReader();
          }).then((reader) => {
            // 前の行が処理されるまで待つ
            while (myCnt > 0 && status[myCnt - 1] < STATUS_PUSHED) { }
            resolve();

            function readChunk({ done, value }) {
              if (isStop) {
                return;
              }

              if (done) {
                // ストリーム終了時: leftover が2バイト以上あれば pendingBytes に追加
                if (leftover.length >= 2) {
                  const leftoverUseBytes = leftover.length - (leftover.length % 2);
                  if (leftoverUseBytes > 0) {
                    const leftoverChunk = leftover.slice(0, leftoverUseBytes);
                    const newPending = new Uint8Array(pendingBytes.length + leftoverChunk.length);
                    newPending.set(pendingBytes, 0);
                    newPending.set(leftoverChunk, pendingBytes.length);
                    pendingBytes = newPending;
                  }
                }
                leftover = new Uint8Array(0);

                addLog(`データ受信完了: 行${myCnt} (${pendingBytes.length}バイト)`);

                // 前の行の再生終了を待つ
                while (myCnt > 0 && status[myCnt - 1] < STATUS_END) {
                  schedulePlayback(myCnt - 1);

                  if (isPlaying)
                    continue;

                  if (pendingBytesQueue.length > 0)
                    continue;

                  if (performance.now() - playStart > 1.2 * getRemainingTime(myCnt - 1))
                    break;
                }

                // ストリーム終わり時点でpendingBytesが残っていれば最終再生
                if (pendingBytes.length > 0) {
                  pendingBytesQueue.push(pendingBytes);
                  status[myCnt] = STATUS_PUSHED;
                  updateStatusDisplay();
                  schedulePlayback(myCnt);
                }
                pendingBytes = new Uint8Array(0); // キューをクリア
                addLog(`キューに追加: 行${myCnt} (キュー内: ${pendingBytesQueue.length})`);

                return;
              }

              // 今回受信した value (Uint8Array) を leftover と結合
              const combined = new Uint8Array(leftover.length + value.length);
              combined.set(leftover, 0);
              combined.set(value, leftover.length);

              // leftover はクリア
              leftover = new Uint8Array(0);

              // 2バイト単位で取り出せるサイズ
              const useBytes = combined.length - (combined.length % 2);
              if (useBytes > 0) {
                // 再生用pendingBytesに追加
                const validChunk = combined.slice(0, useBytes);
                const newPending = new Uint8Array(pendingBytes.length + validChunk.length);
                newPending.set(pendingBytes, 0);
                newPending.set(validChunk, pendingBytes.length);
                pendingBytes = newPending;
              }

              // 端数を leftover に退避
              if (useBytes < combined.length) {
                leftover = combined.slice(useBytes);
              }

              console.log("start reading");
              // 次の値を読みにいく。
              reader.read().then(readChunk);
            }

            // ストリームを読み取る
            reader.read().then(readChunk);

          }).catch((error) => {
            addLog(`エラー: 行${myCnt} - ${error.message}`);
            console.error("エラー:", error);
          });

        }, Math.random() * 500))
    };



    document.getElementById("startButton").addEventListener("click", async () => {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const textInput = document.getElementById("textInput").value.trim();
      const texts = textInput.split("。").filter(t => t.length > 0);
      
      if (texts.length == 0) {
        alert("テキストを入力してください。");
        return;
      }

      // 初期化
      cnt = 0;
      status = [];
      playTexts = [];
      pendingBytes = new Uint8Array(0);
      pendingBytesQueue = [];
      leftover = new Uint8Array(0);
      isPlaying = false;
      isStop = false;
      actualDurations = {};
      activePlayingSources.clear(); // 多重再生管理をクリア
      playbackQueue = []; // 再生待ちキューをクリア
      concurrentPlayDetected = false;
      updateConcurrentPlayingDisplay();
      
      // 待機中表示を非表示
      document.getElementById("waitingNotice").classList.add("hidden");

      addLog(`再生開始: ${texts.length}行のテキストを処理します`);
      document.getElementById("currentText").innerText = texts[0].trim();
      updateStatusDisplay();

      try {
        await texts.reduce(
          (p, v) => p.then(() => f(v.trim())),
          Promise.resolve()
        );
        
        addLog("すべてのテキストの処理が完了しました");
      
      } catch (error) {
        addLog(`エラーが発生しました: ${error.message}`);
        console.error("エラー:", error);
        alert("エラーが発生しました。コンソールをご確認ください。");
      }
    });
  </script>
